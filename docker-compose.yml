services:
  mongo:
    image: mongo:7
    container_name: labtrack-mongo
    restart: unless-stopped
    ports:
      - "27020:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: labtrack
      MONGO_INITDB_ROOT_PASSWORD: labtrack_pass
      MONGO_INITDB_DATABASE: labtrack
    volumes:
      - labtrack-mongo-data:/data/db
    networks:
      - labtrack-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2
    container_name: labtrack-mongo-ui
    restart: unless-stopped
    ports:
      - "8084:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: labtrack
      ME_CONFIG_MONGODB_ADMINPASSWORD: labtrack_pass
      ME_CONFIG_MONGODB_URL: mongodb://labtrack:labtrack_pass@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - labtrack-net

  backend:
    build: ./backend
    container_name: labtrack-backend
    restart: unless-stopped
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGODB_URI=mongodb://labtrack:labtrack_pass@mongo:27017/labtrack?authSource=admin
      - JWT_SECRET=labtrack_jwt_secret_change_in_production
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:3004
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - labtrack-net

  frontend:
    build: ./frontend
    container_name: labtrack-frontend
    restart: unless-stopped
    ports:
      - "3004:80"
    depends_on:
      - backend
    networks:
      - labtrack-net

  proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: proxy-manager
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    volumes:
      - proxy_data:/data
      - proxy_letsencrypt:/etc/letsencrypt
    networks:
      - labtrack-net

volumes:
  labtrack-mongo-data:
  proxy_data:
  proxy_letsencrypt:

networks:
  labtrack-net:
    driver: bridge
